name: Shared evidence isolated foundation and fence qualification

on:
  push:
    branches:
      - codex/shared-evidence-security-draft

permissions:
  contents: read

concurrency:
  group: shared-evidence-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked test dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify inactive application paths offline
        run: |
          node scripts/shared-evidence-adapter-tests.cjs
          node scripts/shared-evidence-consumer-tests.cjs
          node scripts/shared-evidence-relationship-tests.cjs
          node --test scripts/shared-evidence-security-draft-tests.mjs
          node scripts/shared-evidence-mapping-tests.cjs
          node scripts/shared-evidence-mapping-ui-tests.cjs
          node --test scripts/shared-evidence-writer-probe-tests.mjs scripts/shared-evidence-fence-tests.mjs scripts/shared-evidence-native-fence-tests.mjs
          node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Verify frozen scope and offline controls
        run: |
          node scripts/shared-evidence-postgres-qualification-tests.cjs
          node scripts/shared-evidence-postgres-qualification.cjs --check
          node scripts/shared-evidence-writer-qualification.cjs --check

      - name: Set up pinned local Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Initialize disposable runner configuration
        run: supabase init --force

      - name: Start local image source without application migrations
        id: local_image
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY SUPABASE_DB_MIGRATIONS_ENABLED=false supabase db start

      - name: Run owned synthetic foundation interleavings
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/shared-evidence-postgres-qualification.cjs --foundation

      - name: Run actual workspace fence with native sessions and synthetic dependencies
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/shared-evidence-writer-qualification.cjs --fence

      - name: Stop disposable runner Supabase
        if: always() && (steps.local_image.outcome == 'success' || steps.local_image.outcome == 'failure' || steps.local_image.outcome == 'cancelled')
        run: supabase stop --no-backup

      - name: Record bounded qualification scope
        if: always()
        run: |
          echo 'Foundation and actual 64-table fence tests use synthetic dependencies and source DML. Full deployed trigger composition and ingestion-writer qualification remain unavailable. No production readiness claim.' >> "$GITHUB_STEP_SUMMARY"
