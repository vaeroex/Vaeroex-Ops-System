name: Native connection diagnostic

on:
  push:
    branches:
      - codex/native-ci-connection-diagnostics

permissions:
  contents: read

concurrency:
  group: native-connection-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-connection-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install frozen synthetic test dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify closed diagnostic categories
        run: node tools/native-broker-provisioning/tests/connection-diagnostic-tests.cjs
      - name: Install matching public native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades build-essential libssl-dev libcurl4-openssl-dev zlib1g-dev bison flex curl git bzip2 python3 openssl libpq5=16.15-0ubuntu0.24.04.1 libpq-dev=16.15-0ubuntu0.24.04.1
          test "$(dpkg-query -W -f='${Version}' libpq5)" = 16.15-0ubuntu0.24.04.1
      - name: Qualify unchanged native controls with status-only failure labels
        shell: bash
        run: |
          set -euo pipefail
          node tools/native-broker-provisioning/tests/bootstrap.cjs --qualify
