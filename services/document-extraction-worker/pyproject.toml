[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vaeroex-document-extraction-worker"
version = "0.2.0"
description = "Disabled private NVIDIA REST document extraction worker for Vaeroex"
requires-python = "~=3.12.0"
dependencies = [
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "Pillow==12.3.0",
  "pypdfium2==5.12.1",
  "vercel==0.8.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vaeroex_document_worker"]

[[tool.vercel.workflows]]
entrypoint = "vaeroex_document_worker.workflow:workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
