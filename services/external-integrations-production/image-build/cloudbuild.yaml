steps:
  - name: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    id: verify-trigger-context
    entrypoint: node
    args: ["services/external-integrations-production/image-build/verify-trigger-context.mjs"]
    env: ["BUILD_ID=$BUILD_ID"]

  - name: mirror.gcr.io/library/golang@sha256:b970e6d47c09fdd34179acef5c4fecaf6410f0b597a759733b3cbea04b4e604a
    id: test-callback-edge
    dir: services/external-integrations-production/callback-edge
    entrypoint: /bin/bash
    args: ["-ceu", "test -z \"$(gofmt -l .)\" && go test -count=1 ./..."]

  - name: mirror.gcr.io/library/golang@sha256:b970e6d47c09fdd34179acef5c4fecaf6410f0b597a759733b3cbea04b4e604a
    id: compile-callback-edge
    dir: services/external-integrations-production/callback-edge
    entrypoint: /bin/bash
    args: ["-ceu", "GOOS=wasip1 GOARCH=wasm go build -buildvcs=false -buildmode=c-shared -trimpath -o package/plugin.wasm ./plugin"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: build-callback-edge
    dir: services/external-integrations-production/callback-edge
    args:
      - build
      - --no-cache
      - --platform
      - wasm
      - --tag
      - us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-callback-edge:$COMMIT_SHA
      - package

  - name: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    id: verify-bootstrap-source
    dir: services/external-integrations-production/bootstrap-runtime
    entrypoint: /bin/bash
    args: ["-ceu", "node --check callback-boundary.mjs && node --check server.mjs && node --test callback-boundary.test.mjs && node -e 'const p=require(\"./package.json\"); if(Object.keys(p.dependencies||{}).length||Object.keys(p.optionalDependencies||{}).length) process.exit(1)'"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: build-bootstrap-runtime
    args:
      - build
      - --no-cache
      - --tag
      - us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/production-bootstrap:$COMMIT_SHA
      - services/external-integrations-production/bootstrap-runtime

  - name: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    id: bundle-internal-consent
    entrypoint: /bin/bash
    args:
      - -ceu
      - |
        node -e 'if(require("./package.json").packageManager!=="pnpm@9.15.4") process.exit(1)'
        corepack prepare pnpm@9.15.4 --activate
        corepack pnpm install --frozen-lockfile --ignore-scripts
        node scripts/square-production-internal-consent-tests.js
        node scripts/square-production-customer-flow-tests.js
        node scripts/square-production-customer-workspace-tests.js
        corepack pnpm exec ncc build services/external-integrations-production/internal-consent/entry.ts -o services/external-integrations-production/internal-consent/dist --no-cache --transpile-only --external server-only
        node services/external-integrations-production/internal-consent/package-release.cjs

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: build-internal-consent
    args: ["build", "--no-cache", "--tag", "us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-internal-consent:$COMMIT_SHA", "services/external-integrations-production/internal-consent"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: publish-callback-edge
    args: ["push", "us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-callback-edge:$COMMIT_SHA"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: publish-bootstrap-runtime
    args: ["push", "us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/production-bootstrap:$COMMIT_SHA"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: publish-internal-consent
    args: ["push", "us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-internal-consent:$COMMIT_SHA"]

  - name: gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3
    id: resolve-immutable-digests
    entrypoint: /bin/bash
    args:
      - -ceu
      - |
        callback="$$(docker inspect --format='{{index .RepoDigests 0}}' us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-callback-edge:$COMMIT_SHA)"
        bootstrap="$$(docker inspect --format='{{index .RepoDigests 0}}' us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/production-bootstrap:$COMMIT_SHA)"
        consent="$$(docker inspect --format='{{index .RepoDigests 0}}' us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-internal-consent:$COMMIT_SHA)"
        [[ "$$callback" =~ ^us-west1-docker\.pkg\.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-callback-edge@sha256:[a-f0-9]{64}$$ ]]
        [[ "$$bootstrap" =~ ^us-west1-docker\.pkg\.dev/vaeroex-integrations-prod/vaeroex-integrations-images/production-bootstrap@sha256:[a-f0-9]{64}$$ ]]
        [[ "$$consent" =~ ^us-west1-docker\.pkg\.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-internal-consent@sha256:[a-f0-9]{64}$$ ]]
        printf '%s\n' "$$callback" > /workspace/callback-edge.digest
        printf '%s\n' "$$bootstrap" > /workspace/bootstrap-runtime.digest
        printf '%s\n' "$$consent" > /workspace/internal-consent.digest

  - name: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    id: require-completed-scans
    entrypoint: node
    args: ["services/external-integrations-production/image-build/qualify-image-scans.mjs"]
    env: ["BUILD_ID=$BUILD_ID", "COMMIT_SHA=$COMMIT_SHA"]

images:
  - us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-callback-edge:$COMMIT_SHA
  - us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/production-bootstrap:$COMMIT_SHA
  - us-west1-docker.pkg.dev/vaeroex-integrations-prod/vaeroex-integrations-images/square-internal-consent:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
  sourceProvenanceHash: [SHA256]
tags: ["production-image-build"]
timeout: 1200s
